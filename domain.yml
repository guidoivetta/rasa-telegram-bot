responses:
  utter_onboarding:
    - text: "Hola! Soy Pilhue.\n\
        Puedo ayudarte a desarrollar tu huerta agroecológica.\n\n\
        Algunas de mis funcionalidades son:\n\
        \t • Identificación de especie de planta e insecto por foto.\n\
        \t • Proporcionar información de cultivo, cosecha y recetas de plantas de la zona.\n\
        \t • Ayudar a prevenir insectos no deseados en nuestras huertas.\n\
        \t • Y más.\n\n\
        Para empezar, escribí 'Hola'"
  
  utter_help:
    - text: "Hola! Soy Pilhue.\n\
        Puedo ayudarte a desarrollar tu huerta agroecológica.\n\n\
        Algunas de mis funcionalidades son:\n\
        \t • Identificación de especie de planta e insecto por foto.\n\
        \t • Proporcionar información de cultivo, cosecha y recetas de plantas de la zona.\n\
        \t • Ayudar a prevenir insectos no deseados en nuestras huertas.\n\
        \t • Y más.\n\n\
        Para empezar, escribí 'Hola'"
  
  utter_thanks:
    - text: "¡De nada!"
    - text: "¡No hay problema!"

  utter_greet:
    - text: "Hola! Soy Pilhue."
  
