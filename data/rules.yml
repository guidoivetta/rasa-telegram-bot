version: "2.0"

rules:
  - rule: onboarding
    steps:
      - intent: start
      - action: utter_onboarding

  - rule: help
    steps:
      - intent: help
      - action: utter_help

  - rule: greeting
    steps:
      - intent: greet
      - action: utter_greet
      - action: utter_main_menu

  - rule: thanks
    steps:
      - intent: thanks
      - action: utter_thanks
      - action: utter_main_menu

  - rule: back_to_main
    steps:
      - intent: back_to_main_menu
      - action: utter_main_menu

