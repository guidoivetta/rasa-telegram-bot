version: "2.0"

nlu:
  - intent: start
    examples: |
      - /start

  - intent: help
    examples: |
      - /ayuda

  - intent: greet
    examples: |
      - hola
      - cómo estás?

  - intent: goodbye
    examples: |
      - chau
      - adiós

  - intent: thanks
    examples: |
      - gracias
      - muchas gracias
      - muchas gracias!
      - genial, gracias

  - intent: affirm
    examples: |
      - si
      - correcto

  - intent: deny
    examples: |
      - no
      - está mal
      - chau
      - no me molestes
      - tonto
      - malo
      - estúpido
      - salí de acá

  - intent: detect_disease
    examples: |
      - mi planta está enferma?
      - tiene enfermedades?

  - intent: image_url
    examples: |
      - https://api.telegram.org/file/bot

